server {
    listen 80;
    server_name _;

    # CRITICAL FIX: Add a resolver to enable dynamic DNS lookups
    # 127.0.0.11 is the standard Docker internal DNS server
    resolver 127.0.0.11 valid=5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI backend
    location /api/ {
        # CRITICAL FIX: Use 'set' to define the host as a variable.
        # This forces Nginx to resolve the hostname dynamically (at request time),
        # bypassing the startup host resolution failure.
        set $backend_host "medical-backend:8000";
        proxy_pass http://$backend_host;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
