

services:
  # =============================
  # ✅ SQL SERVER DATABASE
  # =============================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: always
    env_file: 
      - ./backend/.env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 90s
    networks:
      - app_network

  # =============================
  # ✅ FASTAPI BACKEND (VOLUME FIXED)
  # =============================
  medical-backend:
    build: ./backend
    container_name: medical-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "true"
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      # 🌟 CRITICAL FIX: Restore the full code mount to sync models.py changes 🌟
      - ./backend:/app
    working_dir: /app
    entrypoint: ["/app/docker-entrypoint.sh"]
    ports:
      - "8000:8000"
    networks:
      - app_network

  # =============================
  # ✅ REACT FRONTEND (NGINX)
  # =============================
  medical-frontend:
    build: ./frontend
    container_name: medical-frontend
    restart: always
    depends_on:
      - medical-backend
    ports:
      - "3000:80"
    networks:
      - app_network

  # =============================
  # ✅ PROMETHEUS
  # =============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./frontend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app_network

  # =============================
  # ✅ LOKI (v3)
  # =============================
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    volumes:
      - ./frontend/monitoring/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app_network

  # =============================
  # ✅ PROMTAIL (v3)
  # =============================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./frontend/monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - app_network

  # =============================
  # ✅ Grafana
  # =============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_network

# =============================
# ✅ VOLUMES & NETWORK
# =============================
volumes:
  mssql_data:
  grafana_data:
  loki_data:

networks:
  app_network:
    name: app_network