services:
  # =============================
  # ✅ 1. SQL SERVER DATABASE
  # =============================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: always
    # CRITICAL: Loads SA_PASSWORD from ./backend/.env
    env_file: 
      - ./backend/.env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD_COMPLEXITY: "N" # Keeps complexity off, just in case.
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # FIX: Use single shell command with bash -c and reliable password variable substitution
      # Using "$$SA_PASSWORD" inside the shell command is the most reliable syntax.
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 15s 
      retries: 30 
      start_period: 90s # Increased start period to 90s for safety on slower systems/Windows
    networks:
      - app_network

  # =============================
  # ✅ 2. FASTAPI BACKEND
  # =============================
  medical-backend:
    build: ./backend
    container_name: medical-backend
    restart: always
    env_file: 
      - ./backend/.env
    environment:
      DOCKER_ENV: "true" 
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    entrypoint: ["/app/docker-entrypoint.sh"]
    ports:
      - "8000:8000"
    networks:
      - app_network

  # =============================
  # ✅ 3. FRONTEND (React + Nginx)
  # =============================
  medical-frontend:
    build: ./frontend
    container_name: medical-frontend
    restart: always
    depends_on:
      - medical-backend 
    ports:
      - "3000:80"
    networks:
      - app_network

  # =============================
  # ✅ 4. PROMETHEUS (Metrics Scraper)
  # =============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./frontend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app_network

  # =============================
  # ✅ 5. LOKI (Log Aggregator)
  # Fix: Ensure command uses the correct flag format for stability
  # =============================
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: always
    volumes:
      - ./frontend/monitoring/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki  # Persistent volume for log storage
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - app_network

  # =============================
  # ✅ 6. PROMTAIL (Log Collector)
  # =============================
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: always
    volumes:
      # Critical for scraping logs from other Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Configuration file mount
      - ./frontend/monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml
      # Host logs (optional, primarily useful if /var/log is shared)
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - app_network

  # =============================
  # ✅ 7. GRAFANA (Visualization)
  # =============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_network

# =============================
# ✅ VOLUMES & NETWORK
# =============================
volumes:
  mssql_data:
  grafana_data:
  loki_data:

networks:
  app_network:
    name: niksain_app_network
